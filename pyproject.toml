[project]
name = "duo-mcp"
version = "0.1.0"
description = "Let Claude Code and Codex consult each other as independent peer agents over MCP"
readme = "README.md"
authors = [
    { name = "Raphaël Kanapitsas", email = "contact@rkan.org" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2.0",
    "mcp-types>=2.2.0",  # imported directly (server.py)
    "pydantic>=2",       # imported directly (server.py)
]

[project.scripts]
duo-mcp = "duo_mcp:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
